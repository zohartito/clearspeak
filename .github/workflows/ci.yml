name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Swift build and offline checks
    # ClearSpeak is a macOS-only SwiftPM package (platforms: .macOS(.v14)).
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build

      - name: Offline checks
        # Same entry point as scripts/test.sh: no XCTest dependency, runs with
        # Command Line Tools alone. Never touches models/ or .venv/.
        run: ./scripts/test.sh
